<!DOCTYPE html>

<head>
</head>

<body>

    <main id="mainInfo">

    </main>

    
</body>
<script>
    function constructPage(jsonData) {
        function constructBlock(object, iteration) {
            let data = []
            let tabSymbols = "  "
            let allTabs = tabSymbols.repeat(iteration)
            let allTabsAddOne = tabSymbols.repeat(iteration + 1)
            if ("name" in object) {
                data.push(`${allTabsAddOne}<span>${object["name"]}</span>`)
            }


            if ("childs" in object) {
                let childs = []
                for (let child of object["childs"]) {
                    let block = constructBlock(child, iteration + 2)
                    childs.push(block)
                }
                data.push(`${allTabsAddOne}<div class='dataChilds'>\n${childs.join('')}</div>`)
            }
            let resStr = data.join('\n')
            return `${allTabs}<div class='dataClass'>\n${resStr}\n${allTabs}</div>`
        }
        document.body.innerHTML = constructBlock(jsonData, 0);
    }
    fetch('src/data/menuTree.json')
        .then(response => response.json())
        .then(constructPage);

</script>
