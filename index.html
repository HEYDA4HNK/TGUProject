
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="src/assets/styles/style.css" />
    <title>Tree</title>
</head>


<body>

    <main id="mainInfo">

    </main>


</body>
<script>
    

    function constructPage(jsonData) {
        const createButton = (className, parent) => {
            const btn = document.createElement('button');
            btn.className = className;
            parent.appendChild(btn);
            return btn;
        }
        function constructBlock(object) {
            

            const infoBlock = document.createElement("div");
            const arrow = createButton("arrowButton", infoBlock);
            const folder = createButton("folderButton", infoBlock);
            
            const baseBlock = document.createElement("div");
            baseBlock.appendChild(infoBlock);
            baseBlock.className = "dataClass";
            infoBlock.className = "infoData";
            if ("childs" in object) {
                const childBlock = document.createElement('div');
                childBlock.className = 'dataChilds';
                baseBlock.appendChild(childBlock);
                for (let child of object["childs"]) {
                    childBlock.appendChild(constructBlock(child));
                }
                arrow.setAttribute("data-is-open", "close");
                childBlock.setAttribute("data-is-open", "close");
            }
            if ("name" in object) {
                const span = document.createElement("span")
                span.appendChild(document.createTextNode(object["name"]))
                infoBlock.append(span)
            }
            return baseBlock
        }
        const main = document.getElementById("mainInfo");
        main.appendChild(constructBlock(jsonData));
        main.addEventListener("click", (e) => {
            if (e.target.className == "arrowButton") {
                const currentArrow = e.target.getAttribute("data-is-open");
                if (!currentArrow)
                    return;
                const isOpen = currentArrow == "open";
                e.target.setAttribute("data-is-open", isOpen ? "close" : "open");
                const childs = e.target.closest(".dataClass").querySelector(".dataChilds");
                childs && childs.setAttribute("data-is-open", isOpen ? "close" : "open");
            }
        })
    }
    fetch('src/data/menuTree.json')
        .then(response => response.json())
        .then(constructPage);

</script>
