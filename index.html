            function pickPropArray(students, prop) {
                let result = []
                for (let i = 0; i < students.length; i++) {

                    }
                }

            function findNums(nums, target) {
                let dict = new Map();
                for (let i = 0; i < nums.length; i++) {
                    if (dict.has(nums[i])) {
                        return [dict.get(nums[i]), i]
                    }
                    else {
                        dict.set(target - nums[i], i)
                    }
                }
            }

            const target = 9

            console.log(res)

        function task5() {
            function findSubstring(strs) {
                let minStr = ''
                let minStrLength = Number.MAX_VALUE
                for (let i = 0; i < strs.length; i++) {
                    let string = strs[i]
                    let strLen = string.length
                    if (minStrLength > strLen) {
                        minStr = string
                        minStrLength = strLen
                    }
                }

                let resultSubstring = ""
                let resultSubstringLenght = 0

                for (let i = 0; i < minStrLength-1; i++) {
                    for (let k = i + 2; k <= minStrLength; k++) {
                        let substring = minStr.slice(i, k)
                        let substringLen = k - i
                        let isSubstring = strs.every(s => s.includes(substring));
                        if (resultSubstringLenght < substringLen && isSubstring) {
                            resultSubstring = substring
                            resultSubstringLenght = substringLen
                        }
                        else if(!isSubstring) {
                            break;
                        }
                    }
                }
                return resultSubstring
            }

            const strs1 = ["цпотокветок", "поток", "хлопопотокк"]
            const res1 = findSubstring(strs1)
            console.log(res1)

            const strs2 = ["собака", "гоночная машина", "машина"]
            const res2 = findSubstring(strs2)
            console.log(res2)

            const strs3 = ["пузико", "мыльные пузыри", "карапузы"]
            const res3 = findSubstring(strs3)
            console.log(res3)
        }
